spring:
  application:
    name: gateway-server
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Soccer Service 라우팅
        - id: soccer-service
          uri: lb://SOCCER-SERVICE
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
        
        # Account Service 라우팅
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/account/**
        
        # User Service 라우팅
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000"
              - "http://ui-server:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
  config:
    import: optional:configserver:http://config-server:8888

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

